name: latex-exam-manager

# Database: dùng Supabase (khai báo DATABASE_URL trong backend/.env).
# Không còn service "db" local.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latex-exam-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_CONTAINER_PORT:-8000}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: latex-exam-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_INTERNAL_URL=http://backend:8000
